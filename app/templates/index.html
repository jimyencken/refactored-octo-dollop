<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#2563eb" id="meta-theme">
    <title>Productivity Assistant</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="apple-touch-icon" href="/static/icon-192.png">
</head>
<body>

<header class="app-header">
    <div class="app-header-left">
        <h1>Productivity Assistant</h1>
        <div class="subtitle" id="header-subtitle"><span class="status-dot online"></span> Ready</div>
    </div>
    <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode">
        <svg id="theme-icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        <svg id="theme-icon-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
</header>

<div class="app-container">
    <!-- Chat Page -->
    <div class="page active" id="page-chat">
        <div class="chat-container">
            <div class="chat-sidebar" id="chat-sidebar"></div>
            <div class="chat-history" id="chat-history">
                <div class="chat-bubble assistant">
                    Hello! I'm your productivity assistant. I can help with scheduling, reminders, drafting messages, and managing your contacts. How can I help?
                </div>
            </div>
            <div class="chat-input-row">
                <input type="text" id="chat-input" placeholder="Type a message..." autocomplete="off">
                <button onclick="sendChat()">Send</button>
            </div>
        </div>
    </div>

    <!-- Contacts Page -->
    <div class="page" id="page-contacts">
        <div class="section-header">
            <h2>Contacts</h2>
            <button class="btn btn-primary btn-sm" onclick="openModal('contact-modal')">+ Add</button>
        </div>
        <div class="tabs">
            <button class="tab active" onclick="filterContacts('all', this)">All</button>
            <button class="tab" onclick="filterContacts('business', this)">Business</button>
            <button class="tab" onclick="filterContacts('personal', this)">Personal</button>
            <button class="tab" onclick="filterContacts('family', this)">Family</button>
        </div>
        <div id="contacts-list"></div>
    </div>

    <!-- Reminders Page -->
    <div class="page" id="page-reminders">
        <div class="section-header">
            <h2>Reminders</h2>
            <button class="btn btn-primary btn-sm" onclick="openModal('reminder-modal')">+ Add</button>
        </div>
        <div class="tabs">
            <button class="tab active" onclick="filterReminders('', this)">All</button>
            <button class="tab" onclick="filterReminders('pending', this)">Pending</button>
            <button class="tab" onclick="filterReminders('triggered', this)">Triggered</button>
        </div>
        <div id="reminders-list"></div>
    </div>

    <!-- Messages Page -->
    <div class="page" id="page-messages">
        <div class="section-header">
            <h2>Messages</h2>
            <button class="btn btn-primary btn-sm" onclick="openModal('message-modal')">+ Draft</button>
        </div>
        <div class="tabs">
            <button class="tab active" onclick="filterMessages('', this)">All</button>
            <button class="tab" onclick="filterMessages('draft', this)">Drafts</button>
            <button class="tab" onclick="filterMessages('sent', this)">Sent</button>
        </div>
        <div id="messages-list"></div>
    </div>

    <!-- Notifications Page -->
    <div class="page" id="page-notifications">
        <div class="section-header">
            <h2>Notifications</h2>
            <button class="btn btn-sm" onclick="markAllRead()">Mark all read</button>
        </div>
        <div id="notifications-list"></div>
    </div>
</div>

<!-- Bottom Navigation -->
<nav class="bottom-nav">
    <button class="nav-item active" onclick="showPage('chat')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Chat
    </button>
    <button class="nav-item" onclick="showPage('contacts')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Contacts
    </button>
    <button class="nav-item" onclick="showPage('reminders')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        Reminders
    </button>
    <button class="nav-item" onclick="showPage('messages')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        Messages
    </button>
    <button class="nav-item" onclick="showPage('notifications')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        Alerts
        <span class="nav-badge" id="notif-badge" style="display:none">0</span>
    </button>
</nav>

<!-- Contact Modal -->
<div class="modal-overlay" id="contact-modal" onclick="if(event.target===this)closeModal('contact-modal')">
    <div class="modal-content">
        <div class="modal-handle"></div>
        <div class="modal-header">
            <h2>Add Contact</h2>
            <button class="modal-close" onclick="closeModal('contact-modal')">&times;</button>
        </div>
        <form onsubmit="return createContact(event)">
            <div class="form-group"><label>Name</label><input name="name" required placeholder="Full name"></div>
            <div class="form-group"><label>Email</label><input name="email" type="email" placeholder="email@example.com"></div>
            <div class="form-group"><label>Phone</label><input name="phone" type="tel" placeholder="+1 (555) 000-0000"></div>
            <div class="form-group"><label>Company</label><input name="company" placeholder="Company name"></div>
            <div class="form-group">
                <label>Relationship</label>
                <select name="relationship_type">
                    <option value="business">Business</option>
                    <option value="personal">Personal</option>
                    <option value="family">Family</option>
                    <option value="acquaintance">Acquaintance</option>
                </select>
            </div>
            <div class="form-group"><label>Follow-up every (days)</label><input name="follow_up_frequency_days" type="number" min="1" placeholder="e.g. 7"></div>
            <div class="form-group"><label>Notes</label><textarea name="notes" placeholder="Add any notes..."></textarea></div>
            <button type="submit" class="btn btn-primary btn-block">Save Contact</button>
        </form>
    </div>
</div>

<!-- Reminder Modal -->
<div class="modal-overlay" id="reminder-modal" onclick="if(event.target===this)closeModal('reminder-modal')">
    <div class="modal-content">
        <div class="modal-handle"></div>
        <div class="modal-header">
            <h2>Add Reminder</h2>
            <button class="modal-close" onclick="closeModal('reminder-modal')">&times;</button>
        </div>
        <form onsubmit="return createReminder(event)">
            <div class="form-group"><label>Title</label><input name="title" required placeholder="What to remember..."></div>
            <div class="form-group"><label>Description</label><textarea name="description" placeholder="Details (optional)"></textarea></div>
            <div class="form-group"><label>Due Date & Time</label><input name="due_at" type="datetime-local" required></div>
            <div class="form-group">
                <label>Recurrence</label>
                <select name="recurrence_rule">
                    <option value="">None</option>
                    <option value="daily">Daily</option>
                    <option value="weekly">Weekly</option>
                    <option value="monthly">Monthly</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Save Reminder</button>
        </form>
    </div>
</div>

<!-- Message Modal -->
<div class="modal-overlay" id="message-modal" onclick="if(event.target===this)closeModal('message-modal')">
    <div class="modal-content">
        <div class="modal-handle"></div>
        <div class="modal-header">
            <h2>Draft Message</h2>
            <button class="modal-close" onclick="closeModal('message-modal')">&times;</button>
        </div>
        <form onsubmit="return createMessage(event)">
            <div class="form-group">
                <label>Contact</label>
                <select name="contact_id" id="msg-contact-select" required></select>
            </div>
            <div class="form-group"><label>Subject</label><input name="subject" placeholder="Message subject"></div>
            <div class="form-group">
                <label>Channel</label>
                <select name="channel">
                    <option value="email">Email</option>
                    <option value="sms">SMS</option>
                    <option value="chat">Chat</option>
                </select>
            </div>
            <div class="form-group"><label>Message</label><textarea name="body" required rows="5" placeholder="Write your message..."></textarea></div>
            <div style="display:flex;gap:8px">
                <button type="submit" class="btn btn-primary" style="flex:1">Save Draft</button>
                <button type="button" class="btn" style="flex:1" onclick="aiDraft()">AI Draft</button>
            </div>
        </form>
    </div>
</div>

<script src="/static/js/app.js"></script>
</body>
</html>
